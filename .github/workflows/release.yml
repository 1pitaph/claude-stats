name: Release

# Trigger: push a semver tag, e.g.
#   git tag v1.2.0 && git push origin v1.2.0
#
# What this does:
#   1. Writes the tag's version into project.yml (MARKETING_VERSION) and uses the
#      workflow run number as the build number (CURRENT_PROJECT_VERSION). The app's
#      Settings ▸ About reads these from the bundle at runtime, so it updates itself.
#   2. Builds Release Claude Stats.app and Claude Stats Lite.app, then packages:
#        • if the Developer ID signing secrets below are configured -> SIGNED +
#          NOTARIZED + stapled DMGs for both variants;
#        • otherwise -> ad-hoc-signed (un-notarized) DMGs and .zips for both
#          variants. Gatekeeper warns on first launch; users open via right-click ▸ Open.
#   3. If SPARKLE_PRIVATE_ED_KEY is set, EdDSA-signs the archives, creates delta
#      updates from recent appcast releases when possible, and writes updated
#      appcast.xml and appcast-lite.xml files for GitHub Pages.
#   4. Creates a GitHub Release for the tag in this public source repo, with the
#      packaged app and any Sparkle deltas attached.
#   5. Uploads the updated appcasts as a GitHub Pages artifact and deploys it in
#      a dedicated `deploy-pages` job, so the deployment and site URL are visible
#      in Actions. The same files are also committed to this repo's gh-pages
#      branch as a versioned snapshot; that branch no longer triggers deployment.
#      During the migration away from 1pitaph/claude-stats-releases, the same
#      appcast is also mirrored to that legacy repo's gh-pages branch when
#      RELEASES_REPO_TOKEN is present. No binaries are uploaded there.
#   6. Commits the bumped project.yml and release history files back to master.
#
# Optional repository secrets (Settings ▸ Secrets and variables ▸ Actions) — set
# ALL of these to get a notarized DMG; leave them unset for the zip/un-notarized DMG path:
#   BUILD_CERTIFICATE_BASE64  Developer ID Application cert exported as .p12, base64-encoded
#                             (macOS:  base64 -i cert.p12 | pbcopy)
#   P12_PASSWORD              password set when exporting the .p12
#   KEYCHAIN_PASSWORD         any string — password for the throwaway CI keychain
#   APPLE_TEAM_ID             10-character Apple Developer Team ID
#   BUILD_PROVISION_PROFILE_BASE64
#                             Full app Developer ID provisioning profile with the
#                             iCloud/CloudKit capability enabled, base64-encoded
#   BUILD_LITE_PROVISION_PROFILE_BASE64
#                             Lite app Developer ID provisioning profile with the
#                             same CloudKit container enabled, base64-encoded
#   NOTARY_APPLE_ID           Apple ID email used for notarization
#   NOTARY_PASSWORD           app-specific password for that Apple ID (appleid.apple.com)
#
# Optional migration secret:
#   RELEASES_REPO_TOKEN       fine-grained PAT scoped to 1pitaph/claude-stats-releases
#                             with Contents: Read and write. When present, the
#                             workflow mirrors appcast.xml to the legacy Pages
#                             branch so old builds can discover the migration
#                             release. This token is not used for release assets.
#
# Auto-update secret (independent of the signing secrets above):
#   SPARKLE_PRIVATE_ED_KEY    base64 EdDSA private key from Sparkle's
#                             `generate_keys -x <file>`. The matching *public*
#                             key goes in Info.plist as SUPublicEDKey. Without
#                             this secret the appcast step is skipped (releases
#                             still publish, but installed apps won't see them).
#                             Requires GitHub Pages enabled for this repo with
#                             Settings → Pages → Source set to GitHub Actions.
#
# Git language stats runtime:
#   The workflow builds a relocatable GitTools runtime from pinned Ruby,
#   github-linguist, and scc versions before packaging the app. `release-build.sh`
#   requires LINGUIST_RUNTIME_SOURCE so we never ship a Homebrew-dependent
#   development wrapper.
#
# Note: the final step pushes a commit to `master`. If `master` has branch
# protection that blocks the built-in GITHUB_TOKEN, either relax it for this
# workflow or swap in a PAT with `contents: write`.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    # Needs Xcode 26.4+: earlier 26.x ship an `actool` that crashes on the Icon
    # Composer `AppIcon.icon` bundle ("AssetCatalogAgent closed the connection").
    # The macos-15 runner image only goes up to 26.3; macos-26 is the first image
    # that preinstalls 26.4.1 stable.
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
    outputs:
      pages_artifact_ready: ${{ steps.sparkle.outputs.enabled }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        # Pinned, NOT `latest-stable`: the macos-26 image also preinstalls 26.5
        # beta, which can be removed or replaced without warning. 26.4.1 is the
        # newest stable Xcode that fixes the Icon Composer actool crash.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not v<MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Detect signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_LITE_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_LITE_PROVISION_PROFILE_BASE64 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [[ -n "$BUILD_CERTIFICATE_BASE64" && -n "$P12_PASSWORD" && -n "$KEYCHAIN_PASSWORD" \
                && -n "$APPLE_TEAM_ID" && -n "$BUILD_PROVISION_PROFILE_BASE64" \
                && -n "$BUILD_LITE_PROVISION_PROFILE_BASE64" \
                && -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — will build notarized DMGs."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets absent — will build un-notarized DMGs + zips."
          fi

      - name: Detect Sparkle EdDSA key
        id: sparkle
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SPARKLE_PRIVATE_ED_KEY present — will publish an updated appcast."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_PRIVATE_ED_KEY not set — skipping appcast publish; installed apps won't auto-update to this release."
          fi

      - name: Install build tools
        run: |
          set -euo pipefail

          formulae=(xcodegen ruby-build go cmake pkg-config icu4c openssl@3 readline libyaml gmp)
          missing=()
          for formula in "${formulae[@]}"; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              echo "$formula already installed; skipping."
            else
              missing+=("$formula")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            brew install "${missing[@]}"
          else
            echo "All Homebrew build tools are already installed."
          fi

      - name: Import Developer ID signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::no 'Developer ID Application' identity found in the imported certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Install Developer ID provisioning profiles
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_LITE_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_LITE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          install_profile() {
            local encoded="$1"
            local label="$2"
            local expected_bundle_id="$3"
            local env_prefix="$4"
            local profile_path="$RUNNER_TEMP/$label.provisionprofile"
            local profile_plist="$RUNNER_TEMP/$label-profile.plist"

            echo -n "$encoded" | base64 --decode -o "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"
            local profile_uuid
            local profile_name
            local profile_app_id
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
            profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist")"

            if [[ "$profile_app_id" != *".$expected_bundle_id" ]]; then
              echo "::error::$label provisioning profile app id '$profile_app_id' does not match '$expected_bundle_id'"
              exit 1
            fi
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-services' "$profile_plist" | grep -Eq '(^|[[:space:]])(CloudKit|\*)($|[[:space:]])' || {
              echo "::error::$label provisioning profile is missing the CloudKit service entitlement"
              exit 1
            }
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$profile_plist" | grep -q 'iCloud.com.claudestats.ClaudeStats' || {
              echo "::error::$label provisioning profile is missing iCloud.com.claudestats.ClaudeStats"
              exit 1
            }

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"
            echo "${env_prefix}_PROVISIONING_PROFILE_SPECIFIER=$profile_name" >> "$GITHUB_ENV"
            echo "Installed $label provisioning profile: $profile_name ($profile_uuid, app id: $profile_app_id)"
          }

          install_profile "$BUILD_PROVISION_PROFILE_BASE64" "claude-stats-cloudkit" "com.claudestats.ClaudeStats" "CLAUDE_STATS"
          install_profile "$BUILD_LITE_PROVISION_PROFILE_BASE64" "claude-stats-lite-cloudkit" "com.claudestats.ClaudeStatsLite" "CLAUDE_STATS_LITE"

      - name: Bump version in project.yml
        run: bash scripts/bump-version.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      - name: Generate in-app release history
        run: python3 scripts/generate-release-history.py --tag "$GITHUB_REF_NAME" --write-history-json

      - name: Build GitTools runtime
        run: |
          bash scripts/build-gittools-runtime.sh "$RUNNER_TEMP/gittools-runtime"
          bash scripts/verify-gittools-runtime.sh "$RUNNER_TEMP/gittools-runtime"

      - name: Build app and package artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          LINGUIST_RUNTIME_SOURCE: ${{ runner.temp }}/gittools-runtime
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::Claude Stats releases must run on Apple Silicon runners."
            exit 1
          fi
          # Defensive: actool talks to these XPC agents and they can be left in a
          # bad state after switching Xcode, which crashes asset-catalog compilation.
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          bash scripts/release-build.sh "${{ steps.version.outputs.version }}"

      - name: Generate release notes from source commits
        # Build notes from source commits between this tag and the previous semver
        # tag (or from the start if this is the first release). `actions/checkout`
        # with fetch-depth: 0 above fetched all tags.
        #
        # We emit two files tuned for different surfaces:
        #   • release_notes.md   → full GitHub Release body from commit subjects + bodies
        #   • release_notes.html → compact Sparkle update dialog notes, optionally
        #     overridden by release-notes/sparkle/<tag>.html or .md
        run: |
          set -euo pipefail
          python3 scripts/generate-release-notes.py \
            --tag "$GITHUB_REF_NAME" \
            --markdown-out release_notes.md \
            --sparkle-html-out release_notes.html

          echo "----- release_notes.md -----"
          cat release_notes.md
          echo "----- release_notes.html -----"
          cat release_notes.html

      - name: Build Sparkle appcasts
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          bash scripts/publish-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" \
            "${{ github.ref_name }}" \
            ClaudeStats \
            appcast.xml \
            "Claude Stats"
          bash scripts/publish-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" \
            "${{ github.ref_name }}" \
            ClaudeStatsLite \
            appcast-lite.xml \
            "Claude Stats Lite"

      - name: Verify GitHub Pages uses Actions
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '.build_type')"
          if [[ "$BUILD_TYPE" != "workflow" ]]; then
            echo "::error::GitHub Pages must use GitHub Actions. Open Settings → Pages and set Source to GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages publishing source is GitHub Actions."

      - name: Configure GitHub Pages
        if: steps.sparkle.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.sparkle.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Create GitHub Release (in source repo)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          body_path: release_notes.md

      - name: Publish appcast snapshot to gh-pages branch
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          PAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "$PAGES_TOKEN" ]]; then
            echo "::error::GITHUB_TOKEN is required to publish the appcast."
            exit 1
          fi

          PAGES_REPO="https://x-access-token:${PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES_DIR="$RUNNER_TEMP/claude-stats-pages"
          rm -rf "$PAGES_DIR"

          if git ls-remote --exit-code --heads "$PAGES_REPO" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$PAGES_REPO" "$PAGES_DIR"
          else
            git clone --depth 1 "$PAGES_REPO" "$PAGES_DIR"
            cd "$PAGES_DIR"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$PAGES_DIR"
          rsync -a --checksum "$GITHUB_WORKSPACE/_site/" "$PAGES_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No GitHub Pages changes to publish."
            exit 0
          fi

          git commit -m "chore: publish appcast for $GITHUB_REF_NAME"
          git push origin gh-pages

      - name: Mirror transitional appcast to legacy GitHub Pages
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASES_REPO_TOKEN" ]]; then
            echo "::warning::RELEASES_REPO_TOKEN is not set — skipping legacy appcast mirror. Older builds that still use the old SUFeedURL will not see this migration release."
            exit 0
          fi

          PAGES_REPO="https://x-access-token:${RELEASES_REPO_TOKEN}@github.com/1pitaph/claude-stats-releases.git"
          PAGES_DIR="$RUNNER_TEMP/claude-stats-releases-pages"
          rm -rf "$PAGES_DIR"

          if git ls-remote --exit-code --heads "$PAGES_REPO" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$PAGES_REPO" "$PAGES_DIR"
          else
            git clone --depth 1 "$PAGES_REPO" "$PAGES_DIR"
            cd "$PAGES_DIR"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$PAGES_DIR"
          rsync -a --checksum "$GITHUB_WORKSPACE/_site/" "$PAGES_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No legacy GitHub Pages changes to publish."
            exit 0
          fi

          git commit -m "chore: mirror appcast for $GITHUB_REF_NAME"
          git push origin gh-pages

      - name: Commit version bump back to master
        run: |
          if git diff --quiet -- project.yml ClaudeStats/Models/ReleaseHistory.generated.swift release-notes/history; then
            echo "project.yml, release history, and release history JSON unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml ClaudeStats/Models/ReleaseHistory.generated.swift release-notes/history
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:master

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  deploy-pages:
    name: Deploy appcast to GitHub Pages
    needs: release
    if: needs.release.outputs.pages_artifact_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
